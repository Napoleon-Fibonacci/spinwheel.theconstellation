<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" id="viewportMeta" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Spin Wheel — Constellation</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/space-grotesk@5/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/space-grotesk@5/500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/space-grotesk@5/600.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/space-grotesk@5/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5/500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5/600.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5/500.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="stars-bg" aria-hidden="true"></div>

<nav class="nav">
  <div class="nav-mark">SPIN WHEEL <span class="nav-sub">— CONSTELLATION</span></div>
  <a href="https://constellation.my.id" class="nav-cta">← Kembali</a>
</nav>

<main class="wrap wrap-wide">

  <div class="add-wheel-row">
    <button class="btn-ghost add-wheel-btn" id="addWheelBtn">+ Tambah Wheel</button>
  </div>

  <div class="wheels-grid">

    <div class="wheel-column" id="wheelCol0" data-wheel="0">
      <div class="wheel-col-label">Wheel 1</div>

      <section class="wheel-section">
        <div class="wheel-stage">
          <div class="pointer" aria-hidden="true"></div>
          <canvas class="wheelCanvas" width="600" height="600"></canvas>
        </div>
        <button class="spin-btn spinBtn">PUTAR</button>
        <div class="spin-hint spinHint"></div>
      </section>

      <section class="panel-card">
        <label>Tambah Opsi</label>
        <div class="add-row">
          <input type="text" class="optionInput" placeholder="Ketik nama opsi…" maxlength="60" />
          <button class="btn-secondary add-btn addBtn">Tambah</button>
        </div>
      </section>

      <section class="panel-card">
        <label>Opsi Aktif <span class="haze activeCount"></span></label>
        <div class="active-list activeList"></div>
        <button class="btn-ghost reset-btn resetBtn">Reset Semua</button>
      </section>

      <section class="panel-card">
        <div class="history-head">
          <label>History</label>
          <button class="clear-history-btn clearHistoryBtn">Hapus History</button>
        </div>
        <div class="history-list historyList">
          <div class="empty">Belum ada hasil spin.</div>
        </div>
      </section>
    </div>

    <div class="wheel-column" id="wheelCol1" data-wheel="1" hidden>
      <div class="wheel-col-label-row">
        <div class="wheel-col-label">Wheel 2</div>
        <button class="remove-wheel-btn" id="removeWheelBtn">✕ Hapus Wheel</button>
      </div>

      <section class="wheel-section">
        <div class="wheel-stage">
          <div class="pointer" aria-hidden="true"></div>
          <canvas class="wheelCanvas" width="600" height="600"></canvas>
        </div>
        <button class="spin-btn spinBtn">PUTAR</button>
        <div class="spin-hint spinHint"></div>
      </section>

      <section class="panel-card">
        <label>Tambah Opsi</label>
        <div class="add-row">
          <input type="text" class="optionInput" placeholder="Ketik nama opsi…" maxlength="60" />
          <button class="btn-secondary add-btn addBtn">Tambah</button>
        </div>
      </section>

      <section class="panel-card">
        <label>Opsi Aktif <span class="haze activeCount"></span></label>
        <div class="active-list activeList"></div>
        <button class="btn-ghost reset-btn resetBtn">Reset Semua</button>
      </section>

      <section class="panel-card">
        <div class="history-head">
          <label>History</label>
          <button class="clear-history-btn clearHistoryBtn">Hapus History</button>
        </div>
        <div class="history-list historyList">
          <div class="empty">Belum ada hasil spin.</div>
        </div>
      </section>
    </div>

  </div>

</main>

<div id="resultModal" class="modal-overlay">
  <div class="modal-card">
    <div id="confettiBurst" class="confetti-burst" aria-hidden="true"></div>
    <div class="modal-eyebrow">Hasil</div>
    <div id="resultName" class="modal-name">—</div>
    <button id="spinAgainBtn" class="btn-secondary">Putar Lagi</button>
    <button id="closeModalBtn" class="btn-ghost">Tutup</button>
  </div>
</div>

<audio id="tickSound" src="sounds/tick.mp3" preload="auto"></audio>
<audio id="stopSound" src="sounds/stop.mp3" preload="auto"></audio>

<script src="script.js"></script>
</body>
</html>
